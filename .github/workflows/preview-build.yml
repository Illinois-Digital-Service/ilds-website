name: Preview Build and Deploy

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (full for main + current ref)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build production site (from main)
        env:
          JEKYLL_ENV: production
        run: |
          git checkout main
          bundle install
          bundle exec jekyll build
          mv _site _site_production
          git checkout ${{ github.sha }}

      - name: Build preview site (current ref)
        run: |
          bundle exec jekyll build --baseurl "/preview-deploy"
        env:
          JEKYLL_ENV: preview

      - name: Merge into Pages artifact
        run: |
          mkdir -p pages-artifact/preview-deploy
          cp -r _site_production/. pages-artifact/
          cp -r _site/. pages-artifact/preview-deploy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

  # Deploy runs as its own job so that "Re-run failed jobs" retries only the
  # deploy, reusing the artifact above instead of uploading a duplicate
  # (which makes deploy-pages fail with "Multiple artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Preview URL
        run: |
          PREVIEW_URL="https://illinoisdigitalservice.org/preview-deploy/"
          echo "## ✅ Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Preview URL:** [$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
